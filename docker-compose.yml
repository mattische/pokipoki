services:
  poker-planning:
    image: mattische/pokipoki:latest
    pull_policy: always
    container_name: pokipoki
    expose:
      - "${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    networks:
      - pokipoki-network

  caddy:
    image: caddy:2-alpine
    container_name: pokipoki-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-pokerplanning.duckdns.org}
      - PORT=${PORT:-3000}
    depends_on:
      - poker-planning
    networks:
      - pokipoki-network

  # Development service — start with: docker compose --profile dev up
  poker-planning-dev:
    build: .
    container_name: pokipoki-dev
    ports:
      - "3001:${PORT:-3000}"
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./server.js:/app/server.js
    restart: unless-stopped
    profiles:
      - dev

networks:
  pokipoki-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
